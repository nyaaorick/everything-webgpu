<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>everything-webgpu — extension page</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; }
      body { margin: 0; padding: 2rem; max-width: 46rem; }
      h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
      p.sub { margin: 0 0 1.5rem; opacity: 0.7; }
      select, button, input { font: inherit; padding: 0.45rem 0.6rem; }
      .row { display: flex; gap: 0.5rem; align-items: center; margin: 0.75rem 0; }
      .row > select { flex: 1; }
      .bar { height: 4px; background: color-mix(in srgb, currentColor 15%, transparent); border-radius: 2px; overflow: hidden; }
      .bar > i { display: block; height: 100%; width: 0; background: currentColor; transition: width 0.2s; }
      #status { font: 13px ui-monospace, monospace; opacity: 0.8; min-height: 1.5em; white-space: pre-wrap; }
      #out { white-space: pre-wrap; padding: 0.75rem; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: 6px; min-height: 3em; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>everything-webgpu — extension page</h1>
    <p class="sub">
      Same library, an extension origin. The store is
      <code>browser.storage.local</code> through the shipped
      <code>adapters/webext</code>, not IndexedDB.
    </p>

    <div class="row">
      <select id="model"><option>Loading model list…</option></select>
      <button id="load" disabled>Load</button>
      <button id="unload" disabled>Eject</button>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div id="status">Idle.</div>

    <div class="row">
      <input id="prompt" style="flex: 1" value="Name three primary colours." />
      <button id="send" disabled>Send</button>
    </div>
    <div id="out"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
